<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151b2b">
  <title>IIDX プレイ記録</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">INF-NOTEBOOK VIEWER</p><h1>プレイ記録</h1></div><button id="refresh" class="quiet">データを更新</button></header>
  <main>
    <section class="search-panel" aria-label="楽曲検索">
      <div class="search-controls">
        <div><label for="search">楽曲名</label><input id="search" type="search" placeholder="曲名の一部を入力" autocomplete="off" spellcheck="false"></div>
        <div><label for="search-mode">検索方法</label><select id="search-mode"><option value="partial">部分一致</option><option value="exact">完全一致</option></select></div>
      </div>
      <div class="selectors">
        <div><label for="style">プレイスタイル</label><select id="style"><option>SP</option><option>DP</option><option>DP BATTLE</option></select></div>
        <div><label for="difficulty">難易度</label><select id="difficulty"><option value="BEGINNER">B · BEGINNER</option><option value="NORMAL">N · NORMAL</option><option value="HYPER">H · HYPER</option><option value="ANOTHER" selected>A · ANOTHER</option><option value="LEGGENDARIA">L · LEGGENDARIA</option></select></div>
      </div>
      <p id="dataset-info" class="muted"></p>
      <p id="status" role="status">データを読み込んでいます…</p>
    </section>
    <div class="workspace">
      <section class="results-panel" aria-label="検索結果"><div class="section-heading"><h2>楽曲</h2><span id="result-count" class="muted"></span></div><ul id="results"></ul><button id="more-results" hidden>さらに表示</button></section>
      <section id="detail" class="detail-panel" aria-label="プレイ履歴" aria-live="polite"><p class="empty">楽曲を選ぶと、ベスト記録と<br>使用オプションを確認できます。</p></section>
    </div>
  </main>
  <footer>inf-notebook に保存された記録を表示します。</footer>
</body>
</html>
